[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "public-ips"
version = "0.1.0"
description = "Collect and normalize provider-published IP ranges"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0,<0.29.0",
  "PyYAML>=6.0.2,<7.0.0",
  "jsonschema>=4.25.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "ruff>=0.12.0,<0.13.0",
  "mypy>=1.17.0,<3.0.0",
  "types-PyYAML>=6.0.12.20250822",
  "types-jsonschema>=4.25.1.20250822",
]

[project.scripts]
public-ips = "public_ips.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/public_ips"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]
packages = ["public_ips"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
