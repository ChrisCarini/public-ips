name: Update provider data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: public-ips-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Generate
        id: generate
        run: public-ips generate
      - name: Summary
        run: |
          echo "## Provider update" >> $GITHUB_STEP_SUMMARY
          echo "Generation complete." >> $GITHUB_STEP_SUMMARY
      - name: Create draft PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(data): update published ranges"
          title: "chore(data): update published ranges"
          body: "Automated validated provider range update."
          draft: true
          labels: data-update
