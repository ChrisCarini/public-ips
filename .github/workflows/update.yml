name: Update provider data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: public-ips-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_IPS_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PUBLIC_IPS_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLIC_IPS_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Generate
        id: generate
        run: public-ips generate
      - name: Check generated file sizes
        run: python -m public_ips.size_guard --root .
      - name: Summary
        run: |
          echo "## Provider update" >> $GITHUB_STEP_SUMMARY
          echo "Generation complete." >> $GITHUB_STEP_SUMMARY
      - name: Create PR
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-provider-data
          commit-message: "chore(data): update published ranges"
          title: "chore(data): update published ranges"
          body: "Automated validated provider range update."
          labels: data-update
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: gh pr merge --auto --squash "$PR_URL"
