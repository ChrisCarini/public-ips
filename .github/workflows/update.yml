name: Update provider data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: public-ips-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Generate
        id: generate
        run: public-ips generate
      - name: Summary
        run: |
          echo "## Provider update" >> $GITHUB_STEP_SUMMARY
          echo "Generation complete." >> $GITHUB_STEP_SUMMARY
      - name: Create draft PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(data): update published ranges"
          title: "chore(data): update published ranges"
          body: "Automated validated provider range update."
          draft: true
          labels: data-update
